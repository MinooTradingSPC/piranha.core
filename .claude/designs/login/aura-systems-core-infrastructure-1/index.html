  &lt;script&gt;
    // --- GSAP Animation ---
    document.addEventListener(&quot;DOMContentLoaded&quot;, () =&gt; {
      gsap.from(&quot;.hero-anim&quot;, {
        y: 20,

        ease: &quot;power3.out&quot;,

    // --- WebGL Magic Rings (Translated from provided React Reference) ---
    // Adapted for a &quot;Dark Orange Clean&quot; and &quot;Dither/Dot-Matrix&quot; atmospheric feel.
    (function initMagicRings() {
      const mount = document.getElementById('magic-rings-container');
      if (!mount) return;

      const vertexShader = `
        void main() {
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        precision highp float;

        uniform float uTime, uAttenuation, uLineThickness;
        uniform float uBaseRadius, uRadiusStep, uScaleRate;
        uniform float uOpacity, uNoiseAmount, uRotation, uRingGap;
        uniform float uFadeIn, uFadeOut;
        uniform float uMouseInfluence, uHoverAmount, uHoverScale, uParallax, uBurst;
        uniform vec2 uResolution, uMouse;
        uniform vec3 uColor, uColorTwo;
        uniform int uRingCount;

        const float HP = 1.5707963;
        const float CYCLE = 3.45;

        float fade(float t) {
          return t &lt; uFadeIn ? smoothstep(0.0, uFadeIn, t) : 1.0 - smoothstep(uFadeOut, CYCLE - 0.2, t);
        }

        float ring(vec2 p, float ri, float cut, float t0, float px) {
          float t = mod(uTime + t0, CYCLE);
          float r = ri + t / CYCLE * uScaleRate;
          float d = abs(length(p) - r);
          float a = atan(abs(p.y), abs(p.x)) / HP;
          float th = max(1.0 - a, 0.5) * px * uLineThickness;
          float h = (1.0 - smoothstep(th, th * 1.5, d)) + 1.0;
          d += pow(cut * a, 3.0) * r;
          return h * exp(-uAttenuation * d) * fade(t);
        }

        void main() {
          float px = 1.0 / min(uResolution.x, uResolution.y);
          vec2 p = (gl_FragCoord.xy - 0.5 * uResolution.xy) * px;
          float cr = cos(uRotation), sr = sin(uRotation);
          p = mat2(cr, -sr, sr, cr) * p;
          p -= uMouse * uMouseInfluence;
          float sc = mix(1.0, uHoverScale, uHoverAmount) + uBurst * 0.3;
          p /= sc;

          vec3 c = vec3(0.0);
          float rcf = max(float(uRingCount) - 1.0, 1.0);

          for (int i = 0; i &lt; 10; i++) {
            if (i &gt;= uRingCount) break;
            float fi = float(i);
            vec2 pr = p - fi * uParallax * uMouse;
            vec3 rc = mix(uColor, uColorTwo, fi / rcf);
            c = mix(c, rc, vec3(ring(pr, uBaseRadius + fi * uRadiusStep, pow(uRingGap, fi), i == 0 ? 0.0 : 2.95 * fi, px)));
          }

          c *= 1.0 + uBurst * 2.0;
          float n = fract(sin(dot(gl_FragCoord.xy + uTime * 100.0, vec2(12.9898, 78.233))) * 43758.5453);
          c += (n - 0.5) * uNoiseAmount;

          // Render base color and alpha
          gl_FragColor = vec4(c, max(c.r, max(c.g, c.b)) * uOpacity);
        }
      `;

      // Configuration Object (Tuned for Dark Orange Mesh/Dither vibe)
      const props = {
        color: '#f97316',       // Bright primary orange
        colorTwo: '#020617',    // Deep slate base
        speed: 0.5,             // Slower, meditative breathing pulse
        ringCount: 7,
        attenuation: 12,
        lineThickness: 1.5,
        baseRadius: 0.3,
        radiusStep: 0.12,
        scaleRate: 0.08,
        opacity: 0.8,
        noiseAmount: 0.05,
        rotation: 0,
        ringGap: 1.5,
        fadeIn: 0.7,
        fadeOut: 0.5,
        followMouse: true,
        mouseInfluence: 0.1,    // Subtle pointer drift
        hoverScale: 1.05,
        parallax: 0.08,
        clickBurst: true,
      };

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
      } catch (e) {
        console.warn(&quot;WebGL not supported&quot;, e);
        return;
      }

      renderer.setClearColor(0x000000, 0);
      mount.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0.1, 10);
      camera.position.z = 1;

      const uniforms = {
        uTime: { value: 0 },
        uAttenuation: { value: 0 },
        uResolution: { value: new THREE.Vector2() },
        uColor: { value: new THREE.Color() },
        uColorTwo: { value: new THREE.Color() },
        uLineThickness: { value: 0 },
        uBaseRadius: { value: 0 },
        uRadiusStep: { value: 0 },
        uScaleRate: { value: 0 },
        uRingCount: { value: 0 },
        uOpacity: { value: 1 },
        uNoiseAmount: { value: 0 },
        uRotation: { value: 0 },
        uRingGap: { value: 1.6 },
        uFadeIn: { value: 0.5 },
        uFadeOut: { value: 0.75 },
        uMouse: { value: new THREE.Vector2() },
        uMouseInfluence: { value: 0 },
        uHoverAmount: { value: 0 },
        uHoverScale: { value: 1 },
        uParallax: { value: 0 },
        uBurst: { value: 0 },
      };

      const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms,
        transparent: true
      });

      const quad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
      scene.add(quad);

      const resize = () =&gt; {
        const w = window.innerWidth;
        const h = window.innerHeight;
        // Clamp DPR for dot-matrix/pixelated feel, and performance
        const dpr = Math.min(window.devicePixelRatio, 1.5);
        renderer.setSize(w, h);
        renderer.setPixelRatio(dpr);
        uniforms.uResolution.value.set(w * dpr, h * dpr);
      };

      resize();
      window.addEventListener('resize', resize);

      let mouse = [0, 0];
      let smoothMouse = [0, 0];
      let hoverAmount = 0;
      let isHovered = false;
      let burst = 0;

      const onMouseMove = (e) =&gt; {
        const rect = mount.getBoundingClientRect();
        mouse[0] = (e.clientX - rect.left) / rect.width - 0.5;
        mouse[1] = -((e.clientY - rect.top) / rect.height - 0.5);
      };

      // We consider the whole document body as hoverable area for background reaction
      document.body.addEventListener('mousemove', onMouseMove);
      document.body.addEventListener('mouseenter', () =&gt; isHovered = true);
      document.body.addEventListener('mouseleave', () =&gt; {
        isHovered = false;
        mouse[0] = 0;
        mouse[1] = 0;
      });
      document.body.addEventListener('click', () =&gt; burst = 1);

      let frameId;
      const animate = (t) =&gt; {
        frameId = requestAnimationFrame(animate);

        smoothMouse[0] += (mouse[0] - smoothMouse[0]) * 0.05;
        smoothMouse[1] += (mouse[1] - smoothMouse[1]) * 0.05;
        hoverAmount += ((isHovered ? 1 : 0) - hoverAmount) * 0.05;
        burst *= 0.92; // Decay burst
        if (burst &lt; 0.001) burst = 0;

        uniforms.uTime.value = t * 0.001 * props.speed;
        uniforms.uAttenuation.value = props.attenuation;
        uniforms.uColor.value.set(props.color);
        uniforms.uColorTwo.value.set(props.colorTwo);
        uniforms.uLineThickness.value = props.lineThickness;
        uniforms.uBaseRadius.value = props.baseRadius;
        uniforms.uRadiusStep.value = props.radiusStep;
        uniforms.uScaleRate.value = props.scaleRate;
        uniforms.uRingCount.value = props.ringCount;
        uniforms.uOpacity.value = props.opacity;
        uniforms.uNoiseAmount.value = props.noiseAmount;
        uniforms.uRotation.value = (props.rotation * Math.PI) / 180;
        uniforms.uRingGap.value = props.ringGap;
        uniforms.uFadeIn.value = props.fadeIn;
        uniforms.uFadeOut.value = props.fadeOut;
        uniforms.uMouse.value.set(smoothMouse[0], smoothMouse[1]);
        uniforms.uMouseInfluence.value = props.followMouse ? props.mouseInfluence : 0;
        uniforms.uHoverAmount.value = hoverAmount;
        uniforms.uHoverScale.value = props.hoverScale;
        uniforms.uParallax.value = props.parallax;
        uniforms.uBurst.value = props.clickBurst ? burst : 0;

        renderer.render(scene, camera);
      };

      frameId = requestAnimationFrame(animate);
    })();
  &lt;/script&gt;
